# mirror.conf for nginx running INSIDE a container on the same Docker network as the apps.
# Container IPs change on recreate, so names are resolved at runtime through Docker DNS.
# `resolve` in upstream servers needs nginx >= 1.27.3 (or nginx plus).

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream auth_mirror {
    zone auth_mirror 64k;
    server shadow_proxy_auth:8019 resolve max_fails=3 fail_timeout=30s;
    server auth_app:8000          resolve backup;
}
upstream core_mirror {
    zone core_mirror 64k;
    server shadow_proxy_core:8019 resolve max_fails=3 fail_timeout=30s;
    server core_app:8000          resolve backup;
}

server {
    listen 443 ssl;
    server_name api.example.com;
    # ... certificates unchanged ...

    # WebSocket and SSE stay on the primary (the proxy would skip them anyway).
    location ^~ /core/ws/ {
        set $core_ws http://core_app:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $core_ws;
    }

    location ~ ^/auth(/.*)?$ {
        set $auth_upstream http://auth_mirror;      # direct.conf: http://auth_app:8000
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_pass $auth_upstream;
    }

    location ~ ^/core(/.*)?$ {
        set $core_upstream http://core_mirror;      # direct.conf: http://core_app:8000
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_pass $core_upstream;
    }
}
