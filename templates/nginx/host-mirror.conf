# mirror.conf for a HOST nginx. Keep the original as direct.conf next to it.
# Only the upstream block and the proxy_pass of the mirrored location differ from direct.conf.

upstream app_mirror {
    server 127.0.0.1:8019 max_fails=3 fail_timeout=30s;   # shadow proxy
    server 127.0.0.1:8020 backup;                          # primary directly (the old proxy_pass target)
}

server {
    server_name example.com;
    listen 443 ssl;
    # ... certificates and the rest unchanged ...

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;              # proxy down → fail over fast
        proxy_next_upstream error timeout;     # never on http_5xx: that would replay non-idempotent requests
        proxy_pass http://app_mirror;          # direct.conf: proxy_pass http://127.0.0.1:8020;
    }

    # Not mirrored: admin, websockets, streams, static — leave them pointing at the primary.
    location /admin/ { proxy_pass http://127.0.0.1:8021; }
}
